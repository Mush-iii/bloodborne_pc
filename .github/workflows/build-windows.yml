name: build-windows

on:
  push:
    branches: [windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'

      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git patch zip
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-headers
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-nlohmann-json

      - name: Build
        shell: msys2 {0}
        env:
          MSYS2_ROOT_WIN: ${{ steps.msys.outputs.msys2-location }}
          # Current MSYS2 libc++ no longer includes these transitively; FidelityFX relies on
          # _countof, swprintf_s, placement new, log2, std::mutex, std::abort.
          CXXFLAGS: -include stdlib.h -include stdio.h -include wchar.h -include new -include cmath -include cstring -include cstdint -include cstdlib -include cstdio -include cwchar -include cassert -include cstddef -include algorithm -include mutex -include string -include vector -include memory -include utility -include functional -include limits -include array -include map -include optional
        run: |
          export MSYS2_ROOT="$(cygpath -u "$MSYS2_ROOT_WIN")"
          git config --global --add safe.directory '*'
          bash build.sh

      - name: Package
        shell: msys2 {0}
        env:
          MSYS2_ROOT_WIN: ${{ steps.msys.outputs.msys2-location }}
          PY_WIN: ${{ steps.py.outputs.python-path }}
        run: |
          export MSYS2_ROOT="$(cygpath -u "$MSYS2_ROOT_WIN")"
          export WINPYTHON="$(cygpath -u "$PY_WIN")"
          bash packaging/windows/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bbport-windows
          path: dist/bbport-windows.zip
          if-no-files-found: error

      - name: Build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-build-log
          path: out/gpu-build.log
          if-no-files-found: ignore

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bbport-windows.zip
